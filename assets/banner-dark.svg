<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 360" width="1000" height="360" font-family="'SF Mono',Menlo,Consolas,'Courier New',monospace">
<defs><style>:root{--ink:#ece7dd;--acc:#d9613f;--acct:#d9613f;--pr:#1c1b21;--ps:#1f1e24;--psk:#111013}
[fill="#e8e2d4"]{fill:var(--ink)}[stroke="#e8e2d4"]{stroke:var(--ink)}[stop-color="#e8e2d4"]{stop-color:var(--ink)}
[fill="#c8553d"]{fill:var(--acc)}[stroke="#c8553d"]{stroke:var(--acc)}[stop-color="#c8553d"]{stop-color:var(--acc)}

.lbl{font-size:13px;letter-spacing:3px;fill:var(--acct)}
.dim{font-size:14px;letter-spacing:2px;fill:var(--ink);opacity:.72}
.h{font-size:16px;font-weight:700;letter-spacing:1px;fill:var(--ink)}
.s{font-size:15px;fill:var(--ink);opacity:.78}
.box{fill:none;stroke:var(--ink);stroke-opacity:.35}
.acc{fill:none;stroke:var(--acc)}
.arrow{stroke:var(--acc);stroke-width:1.5;fill:none;marker-end:url(#ah)}
</style>
<pattern id="dots" width="16" height="16" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="0.8" fill="#e8e2d4" opacity="0.07"/></pattern>
<marker id="ah" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8z" fill="#c8553d"/></marker>
<linearGradient id="fade" x1="0" x2="1"><stop offset="0" stop-color="#e8e2d4" stop-opacity="0"/><stop offset=".5" stop-color="#e8e2d4" stop-opacity=".5"/><stop offset="1" stop-color="#e8e2d4" stop-opacity="0"/></linearGradient>
<style>.name{font-size:52px;font-weight:700;letter-spacing:3px;fill:var(--ink)}.tag{font-size:20px;fill:var(--ink);opacity:.85}
.streak{fill:none;stroke:url(#fade);stroke-linecap:round;stroke-dasharray:380 800;animation:flow 9s linear infinite}
.s2{animation-duration:13s;animation-delay:-4s}.s3{animation-duration:11s;animation-delay:-7s}
@keyframes flow{from{stroke-dashoffset:1180}to{stroke-dashoffset:0}}
.cur{animation:blink 1.1s steps(1) infinite}@keyframes blink{50%{opacity:0}}</style><style>
.travel{animation:trav 28s linear infinite}
@keyframes trav{0%{transform:translateX(0)}0.429%{transform:translateX(0px)}2.500%{transform:translateX(56px)}4.000%{transform:translateX(56px)}6.071%{transform:translateX(112px)}7.571%{transform:translateX(112px)}9.643%{transform:translateX(168px)}11.143%{transform:translateX(168px)}13.214%{transform:translateX(224px)}14.714%{transform:translateX(224px)}16.786%{transform:translateX(280px)}18.286%{transform:translateX(280px)}20.357%{transform:translateX(336px)}21.857%{transform:translateX(336px)}23.929%{transform:translateX(392px)}25.429%{transform:translateX(392px)}27.500%{transform:translateX(448px)}29.000%{transform:translateX(448px)}31.071%{transform:translateX(504px)}32.571%{transform:translateX(504px)}34.643%{transform:translateX(560px)}36.143%{transform:translateX(560px)}38.214%{transform:translateX(616px)}39.714%{transform:translateX(616px)}41.786%{transform:translateX(672px)}43.286%{transform:translateX(672px)}45.357%{transform:translateX(728px)}46.857%{transform:translateX(728px)}48.929%{transform:translateX(784px)}50.429%{transform:translateX(784px)}52.500%{transform:translateX(728px)}54.000%{transform:translateX(728px)}56.071%{transform:translateX(672px)}57.571%{transform:translateX(672px)}59.643%{transform:translateX(616px)}61.143%{transform:translateX(616px)}63.214%{transform:translateX(560px)}64.714%{transform:translateX(560px)}66.786%{transform:translateX(504px)}68.286%{transform:translateX(504px)}70.357%{transform:translateX(448px)}71.857%{transform:translateX(448px)}73.929%{transform:translateX(392px)}75.429%{transform:translateX(392px)}77.500%{transform:translateX(336px)}79.000%{transform:translateX(336px)}81.071%{transform:translateX(280px)}82.571%{transform:translateX(280px)}84.643%{transform:translateX(224px)}86.143%{transform:translateX(224px)}88.214%{transform:translateX(168px)}89.714%{transform:translateX(168px)}91.786%{transform:translateX(112px)}93.286%{transform:translateX(112px)}95.357%{transform:translateX(56px)}96.857%{transform:translateX(56px)}98.929%{transform:translateX(0px)}100%{transform:translateX(0)}}
.hop{transform-box:fill-box;transform-origin:50% 100%;animation:hop 1s infinite}
@keyframes hop{0%{transform:translateY(0) scale(1,1)}
12%{transform:translateY(0) scale(1.1,.88);animation-timing-function:cubic-bezier(.2,.7,.4,1)}
40%{transform:translateY(-34px) scale(.92,1.1);animation-timing-function:cubic-bezier(.6,0,.8,.4)}
70%{transform:translateY(0) scale(1.12,.86)}
82%{transform:translateY(0) scale(1,1)}100%{transform:translateY(0) scale(1,1)}}
.shadow{transform-box:fill-box;transform-origin:50% 50%;animation:shd 1s infinite}
@keyframes shd{0%,100%{transform:scale(1);opacity:.2}12%{transform:scale(1.05);opacity:.2}40%{transform:scale(.55);opacity:.08}70%{transform:scale(1.05);opacity:.2}}
.fg{animation:fg 1s infinite}.fa{animation:fa 1s infinite}
@keyframes fg{0%,13%{opacity:1}14%,69%{opacity:0}70%,100%{opacity:1}}
@keyframes fa{0%,13%{opacity:0}14%,69%{opacity:1}70%,100%{opacity:0}}
.gl{opacity:0;animation:gl 28s infinite}
@keyframes gl{0%,49%{opacity:0}49.3%,51.7%{opacity:1}52%,100%{opacity:0}}
@media (prefers-reduced-motion:reduce){.travel,.hop,.shadow,.fg,.fa,.gl,.streak{animation:none}}
</style></defs>
<rect width="1000" height="360" fill="url(#dots)"/>
<circle cx="850" cy="150" r="52" fill="#c8553d" opacity=".92"/>
<circle cx="850" cy="150" r="70" fill="none" stroke="#c8553d" stroke-opacity=".25" stroke-dasharray="2 6"/>
<g stroke-width="1.5">
<path class="streak" d="M-20 235 C 200 195,420 280,680 225 S 920 205,1020 245"/>
<path class="streak s2" d="M-20 262 C 240 235,470 305,710 262 S 930 250,1020 280" stroke-width="1"/>
<path class="streak s3" d="M-20 288 C 220 272,440 322,660 292 S 920 285,1020 305" stroke-width="1"/></g>
<text x="50" y="50" class="lbl">FIG_000 / PUBLIC PROFILE</text>
<text x="950" y="50" class="dim" text-anchor="end">@RaphaelMouallem</text>
<line x1="50" y1="66" x2="950" y2="66" stroke="#e8e2d4" stroke-opacity=".18"/>
<text x="50" y="132" class="name">RAPHAEL EL MOUALLEM</text>
<text x="50" y="170" class="tag">Software engineer. Full stack &amp; AI.</text>
<text x="50" y="200" class="dim">WHERE SYSTEMS AND AI MEET</text>
<line x1="50" y1="310" x2="950" y2="310" stroke="#e8e2d4" stroke-opacity=".18"/>
<text x="50" y="338" class="dim">// the pet has no off switch</text>
<text x="950" y="338" class="dim" text-anchor="end"><tspan fill="#c8553d">raphaelm ~ %</tspan> whoami<tspan class="cur" fill="#c8553d"> ▍</tspan></text>
<g transform="translate(60 308)"><g class="travel">
<ellipse class="shadow" cx="0" cy="1" rx="22" ry="3.5" fill="#1f1d1a" style="fill:var(--ink)"/>
<g class="hop"><g transform="translate(-36 -60) scale(.3)">
<polygon points="35,30 205,30 191,10 49,10" style="fill:var(--ps);stroke:var(--ink);stroke-opacity:.4" stroke-width="3"/>
<rect x="35" y="30" width="170" height="170" style="fill:var(--pr);stroke:var(--ink);stroke-opacity:.4" stroke-width="3"/>
<circle cx="52" cy="47" r="4" fill="#e0554a"/><circle cx="66" cy="47" r="4" fill="#e0ab4a"/><circle cx="80" cy="47" r="4" fill="#5f9e5a"/>
<rect x="53" y="62" width="134" height="118" style="fill:var(--acc)"/>
<rect x="61" y="70" width="118" height="102" style="fill:var(--psk)"/>
<g style="font-size:40px;font-weight:700;letter-spacing:2px;fill:var(--ink)" text-anchor="middle">
<text class="fg" x="120" y="134">^_^</text><text class="fa" x="120" y="134">^o^</text></g>
<g class="gl"><rect x="61" y="70" width="118" height="102" style="fill:var(--psk)"/><text x="120" y="134" text-anchor="middle" style="font-size:40px;font-weight:700;fill:var(--acc)">#_#</text></g>
</g></g></g></g>
</svg>
