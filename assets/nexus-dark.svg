<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 588" width="1000" height="588" font-family="'SF Mono',Menlo,Consolas,'Courier New',monospace"><defs><style>:root{--ink:#ece7dd;--acc:#d9613f;--acct:#d9613f;--pr:#1c1b21;--ps:#1f1e24;--psk:#111013}
